# Aviorio image pipeline. Runs free on GitHub's servers. No Shopify token needed:
# it only reads public product image links and writes results back into this repo.
name: images
on:
  push:
    paths: ['plans/**.json']
  workflow_dispatch:
    inputs:
      plan: {description: 'Path of a plan file, e.g. plans/led-corner-floor-lamp.json', required: true}
permissions:
  contents: write
concurrency: {group: images, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/cache@v4
        with: {path: ~/models, key: models-v1}
      - uses: actions/cache@v4
        with: {path: ~/.u2net, key: u2net-birefnet-v1}
      - name: Install free models and libraries
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "rembg[cpu]" spandrel rapidocr-onnxruntime opencv-python-headless pillow numpy
      - name: Run every changed plan
        run: |
          if [ -n "${{ github.event.inputs.plan }}" ]; then PLANS="${{ github.event.inputs.plan }}";
          else PLANS=$(git diff --name-only HEAD~1 HEAD -- 'plans/*.json'); fi
          for P in $PLANS; do
            [ -f "$P" ] || continue
            H=$(basename "$P" .json); MODE=$(python -c "import json;print(json.load(open('$P')).get('mode','process'))")
            OUT="out/$H/$MODE"; rm -rf "$OUT" "src/$H"
            python imgtool.py fetch "$P" "src/$H"
            if [ "$MODE" = audit ]; then python imgtool.py audit "src/$H" "$OUT"
            else python imgtool.py process "$P" "src/$H" "$OUT"; fi
          done
      - name: Save results to the repo
        run: |
          git config user.name "aviorio-images-bot"; git config user.email "actions@users.noreply.github.com"
          git add out; git commit -m "Image results for ${{ github.sha }}" || exit 0
          git pull --rebase; git push
